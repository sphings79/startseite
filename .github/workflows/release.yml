name: Release package

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tar.gz and zip
        run: ./deploy/build-package.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/startseite-*.tar.gz dist/startseite-*.zip --title "$GITHUB_REF_NAME" --generate-notes
