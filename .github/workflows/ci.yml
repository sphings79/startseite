name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, pdo_sqlite, mbstring, dom, curl, openssl
          coverage: none
      - name: PHP syntax check
        run: find src public bin tests config -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: |
          for f in public/assets/*.js; do node --check "$f"; done
      - name: Tests
        run: php tests/run.php
