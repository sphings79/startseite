name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - 'public/**'
      - 'bin/**'
      - '.github/workflows/docker.yml'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: startseite:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name startseite -p 8080:80 \
            -e STARTSEITE_USER=admin -e STARTSEITE_PASSWORD=ci-test-password-12345 \
            startseite:test
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' startseite)" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs startseite
          exit 1
      - name: Login page is served
        run: |
          curl -fsS http://127.0.0.1:8080/login | grep -q 'passkey-btn'
      - name: Password login works
        run: |
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" -b "$jar" http://127.0.0.1:8080/login | sed -n 's/.*name="token" value="\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -b "$jar" -H 'Origin: http://127.0.0.1:8080' \
            --data-urlencode "token=$token" -d 'username=admin&password=ci-test-password-12345&next=/' http://127.0.0.1:8080/login)
          test "$code" = "303"
          curl -fsS -b "$jar" http://127.0.0.1:8080/api/state | grep -q '"sections"'
      - name: Container logs
        if: failure()
        run: docker logs startseite

  publish:
    name: Publish to GHCR
    needs: smoke-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Startseite
            org.opencontainers.image.description=Self-hosted speed dial start page with tiles, sections, search, link checks and passkey login
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
